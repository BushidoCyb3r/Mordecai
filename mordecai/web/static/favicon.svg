<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <rect width="128" height="128" rx="28" fill="#0c0b0b"/>
  <defs>
    <radialGradient id="m-glow" cx="64" cy="84" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0242c" stop-opacity=".42"/>
      <stop offset="1" stop-color="#e0242c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="m-liquid" cx="44%" cy="38%" r="72%">
      <stop offset="0" stop-color="#ff7a7f"/>
      <stop offset=".5" stop-color="#d4121c"/>
      <stop offset="1" stop-color="#5c0509"/>
    </radialGradient>
    <linearGradient id="m-glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".04"/>
    </linearGradient>
    <linearGradient id="m-cork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b97a47"/>
      <stop offset="1" stop-color="#77461f"/>
    </linearGradient>
    <linearGradient id="m-tag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ddb47e"/>
      <stop offset="1" stop-color="#b08048"/>
    </linearGradient>
    <clipPath id="m-body"><circle cx="64" cy="82" r="35.6"/></clipPath>
  </defs>
  <circle cx="64" cy="84" r="60" fill="url(#m-glow)"/>
  <!-- cork, seen through the glass lip -->
  <path d="M52 12q0-3 3-3h18q3 0 3 3l-1.6 26h-20.8z" fill="url(#m-cork)" stroke="#5a3519" stroke-width="1.4"/>
  <path d="M55 12.5h18" stroke="#dba06b" stroke-width="1.3" stroke-linecap="round" opacity=".75"/>
  <!-- glass body: round flask with a neck -->
  <path d="M53 32h22v13.6a38 38 0 1 1-22 0z" fill="url(#m-glass)"/>
  <!-- glowing liquid with a rising swirl and bubbles -->
  <g clip-path="url(#m-body)">
    <path d="M24 76c14-8 26 8 40 0s26 6 42-2v48H24z" fill="url(#m-liquid)"/>
    <path d="M24 76c14-8 26 8 40 0s26 6 42-2" fill="none" stroke="#ffc2c4" stroke-width="2" opacity=".85"/>
    <path d="M45 80c-5-10 2-18 9.5-15.5" fill="none" stroke="#ff9ea2" stroke-width="3.2" stroke-linecap="round" opacity=".9"/>
    <g fill="#ff6268" stroke="#ffd6d8" stroke-width=".8" stroke-opacity=".7">
      <circle cx="56" cy="64" r="3.3"/>
      <circle cx="52" cy="96" r="3.6"/><circle cx="78" cy="100" r="5.2"/><circle cx="66" cy="112" r="2.6"/>
      <circle cx="86" cy="88" r="2.4"/><circle cx="45" cy="106" r="2"/><circle cx="72" cy="88" r="1.6"/>
      <circle cx="68" cy="56" r="2.2" opacity=".75"/><circle cx="76" cy="62" r="1.6" opacity=".75"/>
    </g>
  </g>
  <!-- glass outline, lip and highlights -->
  <path d="M53 32h22v13.6a38 38 0 1 1-22 0z" fill="none" stroke="#dcd6d4" stroke-opacity=".8" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="49" y="27.5" width="30" height="7" rx="3.5" fill="#efeae8" fill-opacity=".22" stroke="#dcd6d4" stroke-width="2.2"/>
  <path d="M38 71a28 28 0 0 1 12-19" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".55"/>
  <path d="M56.5 36v8" stroke="#fff" stroke-width="1.6" stroke-linecap="round" opacity=".4"/>
  <path d="M91 100a30 30 0 0 1-6 9" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".3"/>
  <!-- twine round the neck, tied to the tag -->
  <g fill="none" stroke-linecap="round">
    <path d="M52.5 40.5q11.5 4 23 0M52.5 44.5q11.5 4 23 0M77 43q9 1 18 10" stroke="#4e2e14" stroke-width="4"/>
    <path d="M52.5 40.5q11.5 4 23 0M52.5 44.5q11.5 4 23 0M77 43q9 1 18 10" stroke="#b8763a" stroke-width="2.4"/>
    <path d="M52.5 40.5q11.5 4 23 0M52.5 44.5q11.5 4 23 0" stroke="#e0a868" stroke-width="1" stroke-dasharray="1.6 1.8" opacity=".8"/>
  </g>
  <!-- tag stamped with an M -->
  <g transform="rotate(-18 98 62)">
    <path d="M92 48h12l5 5v18l-5 5H92l-5-5V53z" fill="url(#m-tag)" stroke="#6e4a26" stroke-width="1.4" stroke-linejoin="round"/>
    <circle cx="98" cy="53" r="2" fill="#2a1a0c"/>
    <path d="M92.5 71V59l5.5 7 5.5-7v12" fill="none" stroke="#5a3a1c" stroke-width="2.6" stroke-linejoin="miter"/>
  </g>
</svg>
